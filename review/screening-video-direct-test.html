<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screening Video Playback Diagnostic</title><style>body{margin:0;background:#f5f3ee;color:#272b28;font:15px -apple-system,BlinkMacSystemFont,sans-serif;padding:24px}main{max-width:520px;margin:auto}video{display:block;width:100%;aspect-ratio:768/1168;object-fit:cover;background:#222}button{padding:14px 20px;margin:14px 8px 14px 0;font-size:16px}pre{white-space:pre-wrap;font-size:12px;line-height:1.7}</style></head><body><main><h2>WELLNESS SCREENING 動画単体テスト</h2><p>元のレイアウトやスクロール判定を使わず、動画そのものを確認します。</p><video id="v" controls muted playsinline webkit-playsinline preload="auto" poster="IMG_4939.png"><source src="_users_673119ee-02e2-412c-94b4-491119ed1db5_generated_36c6c5f0-0b59-4c9b-b1a4-0d0395232dc1_generated_video.mp4" type="video/mp4"></video><button id="play">0.7倍速で再生</button><button id="load">再読み込み</button><pre id="status">準備中</pre></main><script>const v=document.getElementById('v'),status=document.getElementById('status');function show(msg){status.textContent=msg+'\nreadyState='+v.readyState+' networkState='+v.networkState+' paused='+v.paused+' currentTime='+v.currentTime.toFixed(2)+'\nerror='+(v.error?v.error.code:'none')+'\nsource='+v.currentSrc;}v.playbackRate=.7;for(const name of ['loadstart','loadedmetadata','loadeddata','canplay','playing','pause','waiting','stalled','error','timeupdate'])v.addEventListener(name,()=>show(name));document.getElementById('play').onclick=()=>{v.muted=true;v.playbackRate=.7;v.play().then(()=>show('play succeeded')).catch(e=>show('play rejected: '+e.name+' '+e.message))};document.getElementById('load').onclick=()=>{v.load();show('reloading')};show('initialized');</script></body></html>
