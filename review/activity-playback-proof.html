<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity Playback Proof</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191815;color:#f4f0e8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.intro{min-height:54vh;padding:8vh 8vw 4vh;display:grid;align-content:end}.intro small{letter-spacing:.14em;color:#b9ad98}.intro h1{font:400 clamp(38px,11vw,72px)/.95 Georgia,serif;margin:.35em 0 0}.player{margin:0 5vw 8vh;position:relative;aspect-ratio:768/1184;background:#24211c;overflow:hidden}.player video{width:100%;height:100%;object-fit:cover;display:block}.status{position:fixed;z-index:5;left:12px;right:12px;bottom:12px;background:rgba(20,19,16,.88);backdrop-filter:blur(10px);padding:12px 14px;font-size:12px;line-height:1.6;color:#e7dfd1}.status strong{color:#fff}.event{display:block;color:#bcb3a5}.ok{color:#bcd6bc}.warn{color:#f1c8a9}
</style>
</head>
<body>
<section class="intro"><small>ACTIVITY · PLAYBACK PROOF</small><h1>Scroll until<br>the image is fully shown.</h1></section>
<main class="player" id="card">
  <video id="activity" muted loop playsinline webkit-playsinline preload="auto" aria-label="Activity playback test"><source src="activity-hls-v1/playlist.m3u8" type="application/vnd.apple.mpegurl"></video>
</main>
<div class="status" id="status"><strong>準備中</strong><span class="event">autoplay 属性なし／JavaScriptでの source 差替えなし／load() 呼出しなし</span></div>
<script>
(()=>{
 const v=document.getElementById('activity'),card=document.getElementById('card'),status=document.getElementById('status');
 let ready=false,visible=false,started=false,timer=null;
 const t=()=>new Date().toLocaleTimeString('ja-JP',{hour12:false});
 const show=(title,detail,kind='')=>{status.innerHTML=`<strong class="${kind}">${title}</strong><span class="event">${detail}</span>`;};
 const arm=()=>{
  if(!ready||!visible||started||timer)return;
  v.pause();show('先頭フレームで停止','${t()}　全表示と読込み完了を確認。ここから2秒待機します。','ok');
  timer=setTimeout(()=>{timer=null;if(!ready||!visible||started)return;started=true;show('再生開始','${t()}　2秒待機後に play() を1回だけ実行。','ok');const p=v.play();if(p)p.catch(()=>show('再生できません','${t()}　play() が拒否されました。','warn'));},2000);
 };
 v.addEventListener('loadeddata',()=>{ready=true;show('先頭フレームを読込みました','${t()}　カード全表示を待機中。');arm();});
 v.addEventListener('play',()=>{if(!started){v.pause();show('予期しない再生を停止','${t()}　2秒待機前の play を検出・停止。','warn');}});
 new IntersectionObserver(es=>{const e=es[0];visible=e.intersectionRatio>=.99;if(!visible&&timer){clearTimeout(timer);timer=null;show('待機を解除','${t()}　カードが全表示でなくなったため、タイマーを取消。');}arm();},{threshold:[.99]}).observe(card);
})();
</script>
</body>
</html>
